name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}${{ matrix.dependencies == 'lowest' && ' (lowest)' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        laravel: ['10', '11', '12', '13']
        dependencies: [highest]
        # Each Laravel version on the PHP versions it supports.
        exclude:
          - {laravel: '10', php: '8.4'}
          - {laravel: '10', php: '8.5'}
          - {laravel: '11', php: '8.1'}
          - {laravel: '11', php: '8.5'}
          - {laravel: '12', php: '8.1'}
          - {laravel: '13', php: '8.1'}
          - {laravel: '13', php: '8.2'}
        include:
          - {laravel: '10', testbench: '8'}
          - {laravel: '11', testbench: '9'}
          - {laravel: '12', testbench: '10'}
          - {laravel: '13', testbench: '11'}
          # The oldest combination with the lowest versions composer.json allows.
          - {php: '8.1', laravel: '10', testbench: '8', dependencies: lowest}

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, openssl, sodium, pdo_sqlite
          coverage: none

      # composer.lock is not tracked: pin Laravel and Testbench, then resolve the rest.
      - name: Install Laravel ${{ matrix.laravel }} and Testbench ${{ matrix.testbench }}
        env:
          # Every Laravel 10 and 11 release (and the lowest versions) has open security
          # advisories, e.g. PKSA-mdq4-51ck-6kdq, and Composer 2.9+ refuses to install those.
          # This job only tests compatibility; nothing it installs is deployed.
          COMPOSER_NO_SECURITY_BLOCKING: 1
        run: |
          composer require "laravel/framework:^${{ matrix.laravel }}.0" --no-update --no-interaction
          composer require "orchestra/testbench:^${{ matrix.testbench }}.0" --dev --no-update --no-interaction
          composer update --prefer-dist --no-interaction --no-progress ${{ matrix.dependencies == 'lowest' && '--prefer-lowest --prefer-stable' || '' }}

      - name: Run tests
        run: vendor/bin/phpunit
